name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCASTE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        run: |
          cd python
          python -m pip install \
            "scikit-build-core==0.10.0" \
            "pybind11==2.11.0"
          python -m pip install --no-build-isolation -e .
          python -m unittest discover -s tests -p 'test_*.py'

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Configure (coverage)
        run: |
          cmake -S . -B build-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCASTE_BUILD_TESTS=ON \
            -DCASTE_BUILD_CLI=ON \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"
      - name: Build and test (coverage)
        run: |
          python -m pip install "gcovr==7.0"
          cmake --build build-cov --config Debug
          ctest --test-dir build-cov -C Debug --output-on-failure
      - name: Generate coverage report
        run: |
          gcovr \
            --root . \
            build-cov \
            --filter src \
            --exclude-directories 'build-cov/_deps' \
            --exclude 'tests/.*' \
            --exclude 'python/.*' \
            --txt-summary
          gcovr \
            --root . \
            build-cov \
            --filter src \
            --exclude-directories 'build-cov/_deps' \
            --exclude 'tests/.*' \
            --exclude 'python/.*' \
            --xml-pretty \
            --output build-cov/coverage.xml \
            --html-details build-cov/coverage.html
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            build-cov/coverage.xml
            build-cov/coverage.html
