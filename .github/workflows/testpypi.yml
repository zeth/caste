name: TestPyPI

on:
  workflow_dispatch:

jobs:
  pypi-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheels
        run: |
          python -m pip install -U pip build cibuildwheel
          rm -rf dist .pypi-stage
          mkdir -p dist .pypi-stage
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.pypi-stage/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'venv/' \
            --exclude 'python/build/' \
            --exclude 'python/dist/' \
            ./ .pypi-stage/
          cat > .pypi-stage/pyproject.toml << 'EOF'
          [build-system]
          requires = ["scikit-build-core>=0.10.0", "pybind11>=2.11.0"]
          build-backend = "scikit_build_core.build"

          [project]
          name = "caste"
          version = "0.1.2.1"
          description = "Opinionated hardware classification library."
          readme = "python/README.md"
          requires-python = ">=3.8"
          license = "MIT"
          authors = [{ name = "Zeth", email = "holdercardteam+caste@gmail.com" }]
          keywords = ["hardware", "classification", "system-info", "gpu", "cpu"]

          [project.urls]
          Repository = "https://github.com/zeth/caste"
          Issues = "https://github.com/zeth/caste/issues"

          [project.optional-dependencies]
          test = ["pytest"]

          [tool.scikit-build]
          cmake.version = ">=3.20"
          cmake.source-dir = "python"
          build-dir = "python/build"
          cmake.build-type = "Release"
          cmake.define = { CASTE_BUILD_PYTHON = "OFF", CASTE_BUILD_TESTS = "OFF", CASTE_BUILD_CLI = "OFF" }
          wheel.packages = ["python/caste"]
          EOF
          python -m build --sdist --outdir dist .pypi-stage
          python -m cibuildwheel --output-dir dist .pypi-stage
      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
