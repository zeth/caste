name: Upload Caste to Launchpad

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        series:
          - noble
          - resolute

    steps:
      - uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt update
          sudo apt install -y \
            devscripts \
            debhelper \
            dput \
            gnupg \
            cmake \
            ninja-build \
            catch2 \
            dh-python \
            dh-sequence-python3 \
            python3-all-dev \
            python3-pybind11

      - name: Import GPG key
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          echo "$PPA_GPG_PRIVATE_KEY" | gpg --batch --import

          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          echo "DEBSIGN_KEYID=$KEYID" >> "$GITHUB_ENV"
          echo "Using GPG key: $KEYID"

          cat > ~/.gnupg/gpg.conf <<EOF
          batch
          yes
          pinentry-mode loopback
          EOF

          cat > ~/.gnupg/gpg-agent.conf <<EOF
          allow-loopback-pinentry
          EOF

          gpgconf --kill gpg-agent

      - name: Prepare Debian directory
        env:
          SERIES: ${{ matrix.series }}
        run: |
          rm -rf debian build
          cp -a packaging/linux/debian ./debian

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          fi

          cat > debian/changelog <<EOF
          caste (${VERSION}~${SERIES}1) ${SERIES}; urgency=medium

            * Build for ${SERIES}

           -- Holder Team <holdercardteam@gmail.com>  $(date -R)
          EOF

      - name: Build signed source package
        env:
          DEBFULLNAME: "Holder Team"
          DEBEMAIL: "holdercardteam@gmail.com"
        run: |
          debuild -S -d -k"$DEBSIGN_KEYID"

      - name: Upload to Launchpad PPA
        run: |
          dput ppa:holderteam/caste ../*_source.changes
