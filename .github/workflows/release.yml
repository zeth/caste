name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  cpp-artifacts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCASTE_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Install
        run: cmake --install build --prefix stage
      - name: Package
        shell: bash
        run: |
          name="caste-${{ runner.os }}-${{ github.ref_name }}"
          cd stage
          tar -czf "../${name}.tar.gz" .
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpp-artifact-${{ runner.os }}
          path: caste-*.tar.gz

  publish-release:
    runs-on: ubuntu-latest
    needs: cpp-artifacts
    permissions:
      contents: write
    steps:
      - name: Download cpp artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cpp-artifact-*
          merge-multiple: true
          path: release-assets
      - name: Upload release assets
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          files: release-assets/caste-*.tar.gz

  pypi-build:
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/python/constraints-ci.txt
      PIP_REQUIRE_HASHES: "1"
      CIBW_ENVIRONMENT: PIP_CONSTRAINT=/project/python/constraints-ci.txt PIP_REQUIRE_HASHES=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheels
        run: |
          python -m pip install --require-hashes -r python/constraints-ci.txt
          CASTE_VERSION="$(python - <<'PY'
          import tomllib
          with open("python/pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          test -n "$CASTE_VERSION"
          rm -rf dist .pypi-stage
          mkdir -p dist .pypi-stage
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.pypi-stage/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'venv/' \
            --exclude 'python/build/' \
            --exclude 'python/dist/' \
            ./ .pypi-stage/
          cat > .pypi-stage/pyproject.toml << EOF
          [build-system]
          requires = ["scikit-build-core==0.10.0", "pybind11==2.11.0"]
          build-backend = "scikit_build_core.build"

          [project]
          name = "caste"
          version = "${CASTE_VERSION}"
          description = "Opinionated hardware classification library."
          readme = "python/README.md"
          requires-python = ">=3.8"
          license = "MIT"
          authors = [{ name = "Zeth", email = "holdercardteam+caste@gmail.com" }]
          keywords = ["hardware", "classification", "system-info", "gpu", "cpu"]

          [project.urls]
          Repository = "https://github.com/zeth/caste"
          Issues = "https://github.com/zeth/caste/issues"

          [tool.scikit-build]
          cmake.version = ">=3.20"
          cmake.source-dir = "python"
          build-dir = "python/build"
          cmake.build-type = "Release"
          cmake.define = { CASTE_BUILD_PYTHON = "OFF", CASTE_BUILD_TESTS = "OFF", CASTE_BUILD_CLI = "OFF" }
          wheel.packages = ["python/caste"]
          EOF
          python -m build --sdist --outdir dist .pypi-stage
          python -m cibuildwheel --output-dir dist .pypi-stage
      - name: Upload PyPI workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-dist
          path: dist/*

  pypi-publish:
    runs-on: ubuntu-latest
    needs: pypi-build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download PyPI workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-dist
          path: dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
        with:
          packages-dir: dist
